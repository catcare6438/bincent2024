<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>浪貓不浪｜中途管理系統</title>
<meta name="description" content="動物中途之家管理系統：貓咪資料、健康紀錄、用藥追蹤、認養管理與 LINE 發布">
<meta name="theme-color" content="#F7F3ED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="浪貓不浪">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E6%B5%AA%E8%B2%93%E4%B8%8D%E6%B5%AA%EF%BD%9C%E4%B8%AD%E9%80%94%E7%AE%A1%E7%90%86%E7%B3%BB%E7%B5%B1%22%2C%22short_name%22%3A%22%E6%B5%AA%E8%B2%93%E4%B8%8D%E6%B5%AA%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F7F3ED%22%2C%22theme_color%22%3A%22%23F7F3ED%22%7D">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%239A8068'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F3ED; --bg-card:#FFFFFF; --secondary:#E8E2D9; --text:#403B36; --text-soft:#8A8177;
    --accent:#9A8068; --accent-deep:#7C6650; --line:#E4DCCF;
    --green:#7E9B78; --green-bg:#EAF0E7; --orange:#C98A4B; --orange-bg:#F6EADA; --gray:#9B958D; --gray-bg:#EDEAE4;
    --radius:14px; --shadow:0 1px 2px rgba(64,59,54,0.04), 0 4px 14px rgba(64,59,54,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overflow-x:hidden;
    font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;}
  #root{max-width:1200px;margin:0 auto;min-height:100vh;position:relative;display:flex;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}

  #sidebar{width:220px;flex-shrink:0;display:none;flex-direction:column;padding:28px 16px;
    border-right:1px solid var(--line);position:sticky;top:0;height:100vh;}
  #main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
  #topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;
    border-bottom:1px solid var(--line);background:rgba(247,243,237,0.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    position:sticky;top:0;z-index:20;}
  #topbar .brand{font-size:17px;font-weight:700;letter-spacing:.3px;}
  #topbar .user{font-size:13px;color:var(--text-soft);display:flex;align-items:center;gap:8px;}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
  #view{flex:1;padding:20px 20px 100px 20px;animation:viewFadeIn .22s ease;}
  @keyframes viewFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @media (min-width:900px){#sidebar{display:flex;} #view{padding:28px 32px 40px 32px;} #bottomnav{display:none !important;}}
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#221F1B; --bg-card:#2C2823; --secondary:#3A342C; --text:#F2ECE3; --text-soft:#B3A99C;
      --accent:#C9A98A; --accent-deep:#DDBE9D; --line:#43392F;
      --green:#8FB088; --green-bg:#243A26; --orange:#E0A868; --orange-bg:#3D3220; --gray:#A39A8F; --gray-bg:#332E28;
    }
    #topbar{background:rgba(34,31,27,0.85);}
    #bottomnav{background:rgba(44,40,35,0.85);}
    .upload-slot{background:#332E28;}
  }
  #splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9999;}
  #splash .splash-logo{width:64px;height:64px;border-radius:20px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 22px rgba(154,128,104,0.35);
    animation:splashPulse 1.4s ease-in-out infinite;}
  @keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #splash .splash-text{font-size:13px;color:var(--text-soft);}
  #splash.hide{display:none;}

  .side-logo{font-size:18px;font-weight:700;margin:6px 6px 28px 6px;}
  .side-link{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:14px;
    color:var(--text-soft);font-weight:500;margin-bottom:2px;background:none;border:none;width:100%;text-align:left;}
  .side-link svg{width:18px;height:18px;flex-shrink:0;}
  .side-link.active{background:var(--secondary);color:var(--text);}
  .side-user{margin-top:auto;padding:12px 6px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--text-soft);}

  #bottomnav{position:fixed;bottom:0;left:0;right:0;max-width:1200px;margin:0 auto;background:rgba(255,255,255,0.85);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30;}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text-soft);
    font-weight:500;padding:4px 10px;border-radius:10px;background:none;border:none;transition:transform .12s, color .12s;}
  .nav-item.active{color:var(--accent-deep);}
  .nav-item.active svg{transform:scale(1.12);}
  .nav-item svg{width:22px;height:22px;transition:transform .12s;}
  .nav-item:active{transform:scale(.92);}
  .nav-add{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:flex;
    align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 4px 12px rgba(154,128,104,0.4);
    border:4px solid var(--bg);transition:transform .12s;}
  .nav-add:active{transform:scale(.9);}
  .nav-add svg{width:24px;height:24px;}

  .page-title{font-size:22px;font-weight:700;margin:0 0 4px 0;}
  .page-sub{font-size:13px;color:var(--text-soft);margin:0 0 20px 0;}
  .card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;display:inline-flex;
    align-items:center;gap:6px;justify-content:center;transition:transform .1s;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-deep);}
  .btn-secondary{background:var(--secondary);color:var(--text);}
  .btn-ghost{background:transparent;color:var(--text-soft);border:1px solid var(--line);}
  .btn-sm{padding:9px 14px;min-height:36px;font-size:12.5px;}
  .icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--text-soft);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s;}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn:active{transform:scale(.92);}
  .btn-full{width:100%;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text);}
  .field .hint{font-size:12px;color:var(--text-soft);font-weight:400;margin-left:6px;}
  .field input[type=text],.field input[type=password],.field input[type=date],.field textarea,.field select{
    width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;
    font-size:16px;color:var(--text);appearance:none;-webkit-appearance:none;}
  .field select{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="%238A8177" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>');
    background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;}
  .field textarea{resize:vertical;min-height:80px;line-height:1.6;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .seg{display:flex;gap:8px;flex-wrap:wrap;}
  .seg button{padding:11px 16px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13.5px;
    color:var(--text-soft);font-weight:500;}
  .seg button.active{background:var(--text);color:#fff;border-color:var(--text);}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:10px 15px;min-height:40px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;
    color:var(--text-soft);font-weight:500;}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chip-count{font-size:12px;color:var(--text-soft);margin-top:6px;}
  .toast-wrap{position:fixed;bottom:90px;left:0;right:0;display:flex;justify-content:center;z-index:100;pointer-events:none;}
  @media (min-width:900px){.toast-wrap{bottom:24px;}}
  .toast{background:var(--text);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,0.18);animation:toastin .25s ease;max-width:88%;}
  .toast.err{background:#8A4B3F;}
  @keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;}
  @media (min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
  .stat-card{padding:18px;}
  .stat-num{font-size:26px;font-weight:700;line-height:1;margin-bottom:6px;}
  .stat-label{font-size:12px;color:var(--text-soft);display:flex;align-items:center;gap:6px;}
  .section-title{font-size:15px;font-weight:700;margin:26px 0 12px 0;}
  .recent-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .recent-row:last-child{border-bottom:none;}
  .recent-thumb{width:42px;height:42px;border-radius:9px;object-fit:cover;background:var(--secondary);flex-shrink:0;}
  .recent-name{font-size:14px;font-weight:600;}
  .recent-desc{font-size:12.5px;color:var(--text-soft);}
  .recent-time{font-size:11.5px;color:var(--text-soft);margin-left:auto;flex-shrink:0;}
  .quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media (min-width:640px){.quick-grid{grid-template-columns:repeat(4,1fr);}}
  .quick-btn{padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;
    border:1px solid var(--line);border-radius:var(--radius);font-size:13px;font-weight:600;color:var(--text);transition:transform .1s;}
  .quick-btn svg{width:20px;height:20px;color:var(--accent-deep);}
  .quick-btn:hover{background:var(--secondary);}
  .quick-btn:active{transform:scale(.96);}

  .search-row{display:flex;gap:8px;margin-bottom:12px;}
  .search-row input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;}
  .filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{flex-shrink:0;padding:9px 16px;min-height:40px;border-radius:20px;border:1px solid var(--line);background:#fff;
    font-size:13px;color:var(--text-soft);font-weight:500;display:flex;align-items:center;transition:transform .1s;}
  .filter-chip.active{background:var(--text);color:#fff;border-color:var(--text);}
  .filter-chip:active{transform:scale(.95);}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (min-width:640px){.cat-grid{grid-template-columns:repeat(3,1fr);}}
  @media (min-width:1000px){.cat-grid{grid-template-columns:repeat(4,1fr);}}
  .cat-card{overflow:hidden;cursor:pointer;transition:transform .12s, border-color .12s;}
  .cat-card:hover{border-color:var(--accent);}
  .cat-card:active{transform:scale(.97);}
  .cat-photo{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--secondary);display:block;}
  .cat-photo-ph{width:100%;aspect-ratio:1/1;background:var(--secondary);display:flex;align-items:center;
    justify-content:center;color:var(--text-soft);}
  .cat-body{padding:11px 12px 13px 12px;}
  .cat-name{font-size:14.5px;font-weight:700;margin-bottom:3px;}
  .cat-meta{font-size:12px;color:var(--text-soft);margin-bottom:8px;}
  .cat-foot{display:flex;align-items:center;justify-content:space-between;}
  .cat-updated{font-size:11px;color:var(--text-soft);}

  .empty{text-align:center;padding:60px 20px;color:var(--text-soft);}
  .empty svg{width:44px;height:44px;color:var(--secondary);margin-bottom:14px;}
  .empty p{font-size:14px;margin:0 0 18px 0;}

  .wizard-steps{display:flex;gap:6px;margin-bottom:22px;}
  .wizard-steps div{flex:1;height:4px;border-radius:3px;background:var(--secondary);}
  .wizard-steps div.done{background:var(--accent);}
  .wizard-card{padding:20px 18px 24px 18px;margin-bottom:90px;}
  .step-label{font-size:12px;font-weight:700;color:var(--accent-deep);letter-spacing:.5px;margin-bottom:6px;}
  .step-title{font-size:18px;font-weight:700;margin-bottom:18px;}
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .photo-slot{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--secondary);}
  .photo-slot img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-slot .main-badge{position:absolute;top:6px;left:6px;background:var(--accent);color:#fff;font-size:10px;
    font-weight:700;padding:2px 7px;border-radius:8px;}
  .photo-slot .del-btn{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;
    background:rgba(64,59,54,0.65);color:#fff;border:none;display:flex;align-items:center;justify-content:center;}
  .photo-slot .set-main{position:absolute;bottom:0;left:0;right:0;background:rgba(64,59,54,0.55);color:#fff;
    font-size:10px;text-align:center;padding:4px 0;border:none;width:100%;}
  .upload-slot{aspect-ratio:1/1;border-radius:12px;border:1.5px dashed var(--accent);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--accent-deep);
    font-size:11.5px;font-weight:600;background:#FBF8F4;}
  .upload-slot svg{width:22px;height:22px;}
  .wizard-nav{position:sticky;bottom:70px;background:var(--bg);padding:12px 0 4px 0;display:flex;gap:10px;}
  @media (min-width:900px){.wizard-nav{position:static;padding-top:8px;}}

  .toggle-row{display:flex;gap:8px;}
  .toggle-row button{flex:1;}

  .detail-hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:16px;}
  .detail-hero img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--secondary);}
  .detail-hero-overlay{position:absolute;left:0;right:0;bottom:0;padding:16px;
    background:linear-gradient(to top,rgba(64,59,54,0.55),transparent);}
  .detail-hero-overlay .name{color:#fff;font-size:22px;font-weight:700;margin-bottom:6px;}
  .back-btn{position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;border:none;}
  .detail-actions{display:flex;gap:10px;margin-bottom:20px;}
  .section{margin-bottom:22px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
  .section-head h3{font-size:15px;font-weight:700;margin:0;}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:16px;}
  .kv-grid div span.k{display:block;font-size:11.5px;color:var(--text-soft);margin-bottom:3px;}
  .kv-grid div span.v{font-size:14px;font-weight:600;}
  .log-item{padding:14px 16px;border-bottom:1px solid var(--line);}
  .log-item:last-child{border-bottom:none;}
  .log-date{font-size:12px;color:var(--accent-deep);font-weight:700;margin-bottom:4px;}
  .log-title{font-size:14px;font-weight:600;margin-bottom:2px;}
  .log-note{font-size:13px;color:var(--text-soft);line-height:1.5;}
  .log-by{font-size:11.5px;color:var(--text-soft);margin-top:5px;}
  .thumb-row{display:flex;gap:8px;overflow-x:auto;padding:14px;}
  .thumb-row img{width:76px;height:76px;object-fit:cover;border-radius:10px;flex-shrink:0;background:var(--secondary);}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px;}
  .tag{background:var(--secondary);color:var(--text);font-size:12.5px;padding:5px 11px;border-radius:14px;}
  .med-card{padding:14px 16px;margin-bottom:10px;}
  .med-card.low{border-color:#D98B8B;background:#FBEEEE;}
  @keyframes flashWarn{0%,100%{opacity:1;}50%{opacity:.3;}}
  .med-warning{animation:flashWarn 1s infinite;color:#B23B3B;font-weight:700;font-size:12.5px;}
  .disease-detail-card{padding:12px 14px;margin-bottom:10px;}

  .lightbox-bg{position:fixed;inset:0;background:rgba(20,17,14,0.94);z-index:300;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;}
  .lightbox-img{max-width:92vw;max-height:76vh;object-fit:contain;border-radius:12px;}
  .lightbox-close{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,0.15);color:#fff;border:none;display:flex;align-items:center;justify-content:center;}
  .lightbox-close svg{width:20px;height:20px;}

  .modal-bg{position:fixed;inset:0;background:rgba(64,59,54,0.45);z-index:200;display:flex;
    align-items:flex-end;justify-content:center;}
  @media (min-width:640px){.modal-bg{align-items:center;}}
  .modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    padding:22px 20px 26px 20px;}
  @media (min-width:640px){.modal{border-radius:18px;}}
  .modal h3{font-size:17px;font-weight:700;margin:0 0 16px 0;}
  .line-preview{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;background:#F7F9F4;}
  .line-preview img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
  .line-preview-body{padding:14px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .ai-box{background:#FBF8F4;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .ai-box h4{font-size:13px;font-weight:700;margin:0 0 8px 0;color:var(--accent-deep);}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;
    animation:spin .7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* public site */
  #pubTop{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;}
  #pubTop .brand{font-size:16px;font-weight:700;}
  #pubWrap{max-width:1200px;margin:0 auto;padding:0 0 50px 0;}
  #pubView{padding:18px 20px;}
  .pub-hero{padding:26px 20px 10px 20px;}
  .pub-hero h1{font-size:21px;font-weight:700;margin:0 0 6px 0;}
  .pub-hero p{font-size:13px;color:var(--text-soft);margin:0;}
  .contact-box{background:var(--secondary);border-radius:14px;padding:16px;font-size:13px;line-height:1.7;margin-top:8px;}
  .share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
  .share-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 6px;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);font-size:11.5px;font-weight:600;
    color:var(--text);text-align:center;line-height:1.4;}

function authHeaders(){ const t=localStorage.getItem(TOKEN_KEY); return t?{Authorization:'Bearer '+t}:{}; }
function clearSession(){ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); }
async function apiFetch(path, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  const auth = opts.auth !== false;
  const headers = Object.assign({'Content-Type':'application/json'}, auth?authHeaders():{});
  let res;
  try{
    res = await fetch(API_BASE + path, { method, headers, body: opts.body!==undefined ? JSON.stringify(opts.body) : undefined });
  }catch(e){
    throw new Error('連線失敗，請確認網路連線後再試一次');
  }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    if(res.status===401 && auth){ clearSession(); state.user=null; }
    throw new Error((data && data.error) || '發生錯誤，請稍後再試');
  }
  return data;
}

// ---------------- image compression ----------------
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 900;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

// ---------------- mock AI service (text is generated client-side from filled fields only; swap for a real model call server-side later if needed) ----------------
function mockAIGenerate(cat){
  const personality = (cat.personalityTags||[]).join('、');
  const traits = [];
  if(cat.age) traits.push(cat.age);
  if(cat.color) traits.push(cat.color);
  if(cat.gender) traits.push(cat.gender==='女生'?'小女生':(cat.gender==='男生'?'小男生':cat.gender));
  let intro = (cat.name?cat.name+'\n':'');
  if(traits.length) intro += `${traits.join('、')}。`;
  if(personality) intro += `個性特質：${personality}。`;
  const healthBits = [];
  if(cat.health.external==='已完成') healthBits.push('體外驅蟲');
  if(cat.health.vaccine && cat.health.vaccine!=='未施打' && cat.health.vaccine!=='不知道') healthBits.push('疫苗（'+cat.health.vaccine+'）');
  if(cat.health.neuter==='已完成') healthBits.push('絕育');
  if(cat.health.chip==='已完成') healthBits.push('植入晶片');
  if(healthBits.length) intro += `目前已完成${healthBits.join('、')}。`;
  if(cat.health.status) intro += `健康狀況：${cat.health.status}。`;
  if(!intro.trim()) intro = '（尚無足夠資料可自動生成介紹，請先填寫基本資料）';

  let adopt = '';
  if(personality) adopt += `${cat.name||'牠'}是一個${personality}的孩子。\n\n`;
  adopt += `期待遇見一個願意花時間認識${cat.name||'牠'}、也願意耐心陪伴的家。`;
  if(cat.rescueSource) adopt = `${cat.name||'牠'}來自${cat.rescueSource}。\n\n` + adopt;

  return { intro: intro.trim(), adoptionText: adopt.trim(), generatedAt: Date.now() };
}

  // internal (requires login) — guard
  if(!state.user){ go('public-home'); return; }

}

function bindPublicDetail(){
  const c = state.publicCatDetail;
  document.getElementById('pdBack').addEventListener('click', ()=>go('public-home'));
  document.querySelectorAll('[data-lb]').forEach(img=>img.addEventListener('click', ()=>openLightbox(img.dataset.lb)));
  const copyBtn = document.getElementById('copyLinkBtn');
  if(copyBtn) copyBtn.addEventListener('click', async ()=>{
    const url = window.location.href;
    try{
      await navigator.clipboard.writeText(url);
      toast('已複製分享連結');
    }catch(e){
      toast('複製失敗，請手動複製網址列連結','err');
    }
  });
  const lineBtn = document.getElementById('shareLineBtn');
  if(lineBtn) lineBtn.addEventListener('click', async ()=>{
    const url = window.location.href;
    const info = c ? [c.gender, c.age, c.color].filter(Boolean).join(' ｜ ') : '';
    const text = c
      ? `【${c.name}】${info?'\n'+info:''}\n目前狀態：${c.status}\n一起來看看浪貓不浪的貓咪吧！`
      : '一起來看看浪貓不浪的貓咪吧！';
    const photoUrl = (c && c.photos && c.photos[0]) || null;

    if(navigator.share){
      try{
        const shareData = { title: c?c.name+' 正在等待一個家':'浪貓不浪', text, url };
        if(photoUrl && navigator.canShare){
          try{
            const resp = await fetch(photoUrl);
            const blob = await resp.blob();
            const file = new File([blob], (c?c.name:'cat')+'.jpg', { type: blob.type || 'image/jpeg' });
            if(navigator.canShare({ files:[file] })) shareData.files = [file];
          }catch(e){}
        }
        await navigator.share(shareData);
        return;
      }catch(e){
        if(e && e.name==='AbortError') return;
      }
    }
    const shareUrl = `https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
    window.open(shareUrl, '_blank', 'noopener');
  });
}

            <label>選擇您的姓名</label>
            <select id="loginVol">
              ${activeVolunteers().length? activeVolunteers().map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('') : `<option value="">尚無志工帳號，請洽管理員新增</option>`}
            </select>
          </div>
          <div class="field" style="text-align:left"><label>密碼</label><input type="password" id="loginPw" placeholder="請輸入密碼"></div>
        ` : `
          <div class="field" style="text-align:left"><label>管理員密碼</label><input type="password" id="loginAdminPw" placeholder="請輸入管理員密碼"></div>
        `}
        <button class="btn btn-primary btn-full" id="loginBtn">登入</button>
      </div>
    </div>
  `;
}
function bindLogin(){
  document.querySelectorAll('.login-tabs button').forEach(b=>b.addEventListener('click', ()=>{ state.loginTab=b.dataset.tab; render(); }));
  const btn = document.getElementById('loginBtn');
  btn.addEventListener('click', async ()=>{
    btn.disabled = true; const originalText = btn.textContent; btn.innerHTML = `<span class="spinner"></span> 登入中...`;
    try{
      let body;
      if(state.loginTab==='admin'){
        const pw = document.getElementById('loginAdminPw').value;
        if(!pw){ toast('請輸入管理員密碼','err'); return; }
        body = { role:'admin', password: pw };
      } else {
        const volSel = document.getElementById('loginVol');
        const volId = volSel ? volSel.value : '';
        const pw = document.getElementById('loginPw').value;
        if(!volId){ toast('請先請管理員新增志工帳號','err'); return; }
        if(!pw){ toast('請輸入密碼','err'); return; }
        body = { role:'volunteer', volunteerId: volId, password: pw };
      }
      const res = await apiFetch('/api/auth/login', { method:'POST', auth:false, body });
      localStorage.setItem(TOKEN_KEY, res.token);
      localStorage.setItem(USER_KEY, JSON.stringify(res.user));
      state.user = res.user;
      await loadInternalData();
      state.view = 'dashboard';
      render();
      toast(`歡迎回來，${res.user.name}`);
    }catch(e){
      toast(e.message,'err');
    }finally{
      btn.disabled = false; btn.innerHTML = originalText;
    }
  });
}

function bindAddCat(){
  const ac = state.addCat;
  const cancel = document.getElementById('wCancel');
  if(cancel) cancel.addEventListener('click', ()=>{ if(confirm('確定要放棄新增這隻貓咪嗎？')) go('cats'); });
  const prev = document.getElementById('wPrev'); if(prev) prev.addEventListener('click', ()=>{ ac.step--; render(); });
  const next = document.getElementById('wNext'); if(next) next.addEventListener('click', ()=>{ saveStepFields(ac); ac.step++; render(); });
  const save = document.getElementById('wSave');
  if(save) save.addEventListener('click', async ()=>{
    if(!ac.name.trim()){ toast('請至少填寫貓咪姓名','err'); ac.step=2; render(); return; }
    const color = ac.color==='其他' ? (ac.colorOther.trim()||'其他') : ac.color;
    const rescueSource = ac.rescueSource==='其他' ? (ac.rescueSourceOther.trim()||'其他') : ac.rescueSource;
    const healthStatus = ac.health.status==='其他' ? (ac.health.statusOther.trim()||'其他') : ac.health.status;
    const body = {
      name: ac.name.trim(), gender: ac.gender, age: ac.age, color, personalityTags: ac.personalityTags.slice(),
      fosterDate: ac.fosterDate, rescueSource, status: ac.status,
      health: Object.assign({}, ac.health, {status:healthStatus}),
      photos: ac.photos, aiContent: ac.ai
    };
    save.disabled = true; const original = save.innerHTML; save.innerHTML = `<span class="spinner"></span> 建立中...`;
    try{
      const cat = await apiFetch('/api/cats', { method:'POST', body });
      replaceCatInState(cat);
      toast(`已建立${cat.name}的資料`);
      state.currentCatId = cat.id; state.addCat = null; state.view = 'catdetail';
      render();
    }catch(e){
      toast(e.message,'err');
      save.disabled = false; save.innerHTML = original;
    }
  });

  if(ac.step===1){
    const input = document.getElementById('photoInput');
    if(input) input.addEventListener('change', async (e)=>{
      const files = Array.from(e.target.files||[]);
      for(const f of files){ try{ const data = await compressImage(f); ac.photos.push({data, isMain: ac.photos.length===0}); }catch(err){} }
      render();
    });
    document.querySelectorAll('[data-delphoto]').forEach(b=>b.addEventListener('click', ()=>{
      const i=+b.dataset.delphoto; const wasMain=ac.photos[i].isMain; ac.photos.splice(i,1);
      if(wasMain && ac.photos.length) ac.photos[0].isMain=true; render();
    }));
    document.querySelectorAll('[data-mainphoto]').forEach(b=>b.addEventListener('click', ()=>{
      ac.photos.forEach(p=>p.isMain=false); ac.photos[+b.dataset.mainphoto].isMain=true; render();
    }));
  }
  if(ac.step===2){
    document.getElementById('f_gender').addEventListener('change', e=>ac.gender=e.target.value);
    document.getElementById('f_age').addEventListener('change', e=>ac.age=e.target.value);
    document.getElementById('f_color').addEventListener('change', e=>{ ac.color=e.target.value; render(); });
    document.getElementById('f_rescueSource').addEventListener('change', e=>{ ac.rescueSource=e.target.value; render(); });
    document.getElementById('f_status').addEventListener('change', e=>ac.status=e.target.value);
    document.querySelectorAll('#f_personality .chip').forEach(b=>b.addEventListener('click', ()=>{
      const p=b.dataset.p; const idx=ac.personalityTags.indexOf(p);
      if(idx>=0) ac.personalityTags.splice(idx,1); else ac.personalityTags.push(p);
      render();
    }));
  }
  if(ac.step===3){
    ['external','neuter','chip'].forEach(k=>{
      const el=document.getElementById('h_'+k); if(el) el.addEventListener('change', e=>ac.health[k]=e.target.value);
    });
    document.getElementById('h_vaccine').addEventListener('change', e=>ac.health.vaccine=e.target.value);
    document.getElementById('h_status').addEventListener('change', e=>{ ac.health.status=e.target.value; render(); });
  }
  if(ac.step===4){
    const gen = document.getElementById('aiGenBtn'); if(gen) gen.addEventListener('click', ()=>runAI(ac));
    const regen = document.getElementById('aiRegenBtn'); if(regen) regen.addEventListener('click', ()=>{ saveAIEdits(ac); runAI(ac); });
    const introEl = document.getElementById('ai_intro'); const adoptEl = document.getElementById('ai_adopt');
    if(introEl) introEl.addEventListener('input', e=>ac.ai.intro=e.target.value);
    if(adoptEl) adoptEl.addEventListener('input', e=>ac.ai.adoptionText=e.target.value);
  }
}
function saveStepFields(ac){
  const g = id=>{ const el=document.getElementById(id); return el?el.value:undefined; };
  if(ac.step===2){
    ac.name = g('f_name')||''; ac.colorOther = g('f_colorOther')!==undefined?g('f_colorOther'):ac.colorOther;
    ac.rescueSourceOther = g('f_rescueSourceOther')!==undefined?g('f_rescueSourceOther'):ac.rescueSourceOther;
    ac.fosterDate = g('f_fosterDate')||ac.fosterDate;
  }
  if(ac.step===3){ ac.health.statusOther = g('h_statusOther')!==undefined?g('h_statusOther'):ac.health.statusOther; ac.health.note = g('h_note')||''; }
}
function saveAIEdits(ac){
  const introEl=document.getElementById('ai_intro'); const adoptEl=document.getElementById('ai_adopt');
  if(ac.ai && introEl) ac.ai.intro=introEl.value; if(ac.ai && adoptEl) ac.ai.adoptionText=adoptEl.value;
}
async function runAI(ac){
  ac.aiLoading=true; render();
  await new Promise(r=>setTimeout(r,650));
  const tempCat = { name:ac.name, gender:ac.gender, age:ac.age, color: ac.color==='其他'?ac.colorOther:ac.color,
    personalityTags: ac.personalityTags, rescueSource: ac.rescueSource==='其他'?ac.rescueSourceOther:ac.rescueSource,
    health: Object.assign({}, ac.health, {status: ac.health.status==='其他'?ac.health.statusOther:ac.health.status}) };
  ac.ai = mockAIGenerate(tempCat);
  ac.aiLoading=false; render();
  toast('AI 已完成整理，請確認內容');
}

// ---------- medication tracking ----------
function medCard(m){
  const empty = m.remainingPacks<=0;
  const low = !empty && m.remainingPacks<=5;
  const remainDays = m.perDay ? Math.floor(m.remainingPacks/m.perDay) : null;
  return `
    <div class="card med-card ${low?'low':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
        <div style="font-weight:700;font-size:14px">${esc(m.disease)}</div>
        ${empty?`<span class="pill" style="background:var(--gray-bg);color:var(--gray)">已用完</span>`
          : low?`<span class="med-warning">⚠️ 剩餘 ${m.remainingPacks} 包，藥量即將用完</span>`
          : `<span class="pill" style="background:var(--green-bg);color:var(--green)">剩餘 ${m.remainingPacks} 包</span>`}
      </div>
      <div style="font-size:12.5px;color:var(--text-soft);margin-bottom:8px">
        服用情況：${esc(m.frequency)}　·　剩餘可服用約 ${remainDays!=null?remainDays+' 天':'—'}　·　開立人員：${esc(m.by)}
      </div>
      ${!empty?`<button class="btn btn-ghost btn-sm" data-consume="${m.id}">記錄服用一包</button>`:''}
    </div>
  `;
}

    openLightbox(img.dataset.photo, {
      setMainLabel: isMain ? null : '設為主要照片',

        }catch(e){ toast(e.message,'err'); }

      replaceCatInState(cat); render();

      else toast('已記錄服用');
    }catch(e){ toast(e.message,'err'); }

}

// ---------- modals ----------
function openModal(html, onMount){
  const bg = document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  document.body.appendChild(bg); onMount && onMount(bg); return bg;
}
function openLightbox(src, opts){
  opts = opts || {};
  const bg = document.createElement('div'); bg.className='lightbox-bg';
  bg.innerHTML = `
    <button class="lightbox-close" id="lbClose">${ICONS.x}</button>
    <img src="${src}" class="lightbox-img">
    ${opts.setMainLabel?`<button class="btn btn-primary" id="lbSetMain">${opts.setMainLabel}</button>`:''}
  `;
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  document.body.appendChild(bg);
  bg.querySelector('#lbClose').addEventListener('click', ()=>bg.remove());
  if(opts.onSetMain){
    bg.querySelector('#lbSetMain').addEventListener('click', async ()=>{ await opts.onSetMain(); bg.remove(); });
  }
}

function openHealthModal(c){
  const local = { diseases:[], extraCustom:[], med:{} };

    <div class="field"><label>日期</label><input type="date" id="m_date" value="${todayInput()}"></div>

      <div class="chip-count" id="diseaseCount">已選擇 0 項</div>
    </div>
    <div class="field">
      <div style="display:flex;gap:8px">
        <input type="text" id="m_customDisease" placeholder="例如：耳血腫（清單沒有的可輸入）" style="flex:1">

  `, (bg)=>{
    function refresh(){
      bg.querySelector('#diseaseChipsWrap').innerHTML = diseaseChipsHTML(local);
      bg.querySelector('#diseaseDetails').innerHTML = diseaseDetailHTML(local);
      bg.querySelector('#diseaseCount').textContent = `已選擇 ${local.diseases.length} 項`;
    }
    bg.querySelector('#diseaseChipsWrap').addEventListener('click', e=>{
      const btn = e.target.closest('[data-d]'); if(!btn) return;
      const name = btn.dataset.d; const idx = local.diseases.indexOf(name);
      if(idx>=0) local.diseases.splice(idx,1); else local.diseases.push(name);
      refresh();
    });
    bg.querySelector('#diseaseDetails').addEventListener('change', e=>{
      const el = e.target.closest('[data-medfield]'); if(!el) return;
      const name = el.dataset.disease; const field = el.dataset.medfield;
      const m = local.med[name] || (local.med[name]={needsMed:false, totalPacks:'', frequency:'一天一次'});
      if(field==='needsMed') m.needsMed = el.value==='1';
      else if(field==='totalPacks') m.totalPacks = el.value;
      else if(field==='frequency') m.frequency = el.value;
      refresh();
    });
    bg.querySelector('#m_addCustomDisease').addEventListener('click', ()=>{
      const input = bg.querySelector('#m_customDisease'); const name = input.value.trim();
      if(!name) return;
      if(!local.extraCustom.includes(name) && !DISEASE_LIST.includes(name)) local.extraCustom.push(name);
      if(!local.diseases.includes(name)) local.diseases.push(name);
      input.value=''; refresh();
    });
    bg.querySelector('#m_cancel').addEventListener('click', ()=>bg.remove());
    bg.querySelector('#m_save').addEventListener('click', async ()=>{
      const saveBtn = bg.querySelector('#m_save');
      const date = bg.querySelector('#m_date').value || todayInput();
      const type = bg.querySelector('#m_type').value; const note = bg.querySelector('#m_note').value.trim();
      const diseaseRecords = local.diseases.map(name=>{
        const m = local.med[name] || {needsMed:false};
        return { name, needsMed: !!m.needsMed, totalPacks: m.totalPacks||'', frequency: m.frequency||'一天一次' };
      });
      saveBtn.disabled = true; saveBtn.innerHTML = `<span class="spinner"></span> 儲存中...`;
      try{
        const cat = await apiFetch(`/api/cats/${c.id}/actions`, { method:'POST', body:{ action:'health-record', payload:{ date, type, note, diseases: diseaseRecords } } });
        replaceCatInState(cat); bg.remove(); render();
        toast('資料已更新');
      }catch(e){
        toast(e.message,'err'); saveBtn.disabled=false; saveBtn.textContent='儲存';
      }
    });
  });
}
function openFosterLogModal(c){
  openModal(`
    <h3>新增今日紀錄</h3>
    <div class="field"><label>日期</label><input type="date" id="m_date" value="${todayInput()}"></div>
    <div class="field"><label>今天發生什麼事</label><textarea id="m_content" rows="4" placeholder="例如：今天開始願意主動靠近人"></textarea></div>
    <div class="ai-box"><h4>AI 整理成「今日中途日常」</h4>
      <button class="btn btn-secondary btn-full" id="m_ai" type="button">AI 幫我整理</button>
      <div id="m_aiResult"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost btn-full" id="m_cancel">取消</button><button class="btn btn-primary btn-full" id="m_save">儲存</button></div>
  `, (bg)=>{
    bg.querySelector('#m_cancel').addEventListener('click', ()=>bg.remove());
    bg.querySelector('#m_ai').addEventListener('click', ()=>{
      const text = bg.querySelector('#m_content').value; const result = mockAIFosterLog(text);
      bg.querySelector('#m_aiResult').innerHTML = `<div class="field" style="margin-top:10px"><textarea id="m_content2" rows="5">${esc(result)}</textarea></div>`;
    });
    bg.querySelector('#m_save').addEventListener('click', async ()=>{
      const saveBtn = bg.querySelector('#m_save');
      const date = bg.querySelector('#m_date').value || todayInput();
      const c2 = bg.querySelector('#m_content2');
      const content = (c2 ? c2.value : bg.querySelector('#m_content').value).trim();
      if(!content){ toast('請輸入內容','err'); return; }
      saveBtn.disabled = true; saveBtn.innerHTML = `<span class="spinner"></span> 儲存中...`;
      try{
        const cat = await apiFetch(`/api/cats/${c.id}/actions`, { method:'POST', body:{ action:'foster-log', payload:{ date, content } } });
        replaceCatInState(cat); bg.remove(); render();
        toast('資料已更新');
      }catch(e){
        toast(e.message,'err'); saveBtn.disabled=false; saveBtn.textContent='儲存';
      }
    });
  });
}
function openStatusModal(c){
  openModal(`
    <h3>變更認養狀態</h3>
    ${selectField('m_status','新狀態', ADOPTION_STATUS_OPTIONS, c.adoption.status)}
    <div class="field"><label>備註</label><textarea id="m_note" placeholder="選填"></textarea></div>
    <div class="modal-actions"><button class="btn btn-ghost btn-full" id="m_cancel">取消</button><button class="btn btn-primary btn-full" id="m_save">確認變更</button></div>
  `, (bg)=>{
    bg.querySelector('#m_cancel').addEventListener('click', ()=>bg.remove());
    bg.querySelector('#m_save').addEventListener('click', async ()=>{
      const saveBtn = bg.querySelector('#m_save');
      const status = bg.querySelector('#m_status').value; const note = bg.querySelector('#m_note').value.trim();
      saveBtn.disabled = true; saveBtn.innerHTML = `<span class="spinner"></span> 處理中...`;
      try{
        const cat = await apiFetch(`/api/cats/${c.id}/actions`, { method:'POST', body:{ action:'adoption-status', payload:{ status, note } } });
        replaceCatInState(cat); bg.remove(); render();
        toast('資料已更新');
      }catch(e){
        toast(e.message,'err'); saveBtn.disabled=false; saveBtn.textContent='確認變更';
      }
    });
  });
}
function openPhotoModal(c){
  openModal(`
    <h3>新增照片</h3>
    <label class="upload-slot" style="width:100%;aspect-ratio:2.4/1;margin-bottom:16px">${ICONS.camera}<span>拍照／選擇照片</span>
      <input type="file" accept="image/*" multiple id="m_file" style="display:none"></label>
    <div class="modal-actions"><button class="btn btn-ghost btn-full" id="m_close">完成</button></div>
  `, (bg)=>{
    bg.querySelector('#m_file').addEventListener('change', async (e)=>{
      const files = Array.from(e.target.files||[]);
      const photos = [];
      const catHadNoPhotos = !c.photos || c.photos.length===0;
      for(const f of files){
        try{
          const data = await compressImage(f);
          photos.push({data, isMain: catHadNoPhotos && photos.length===0});
        }catch(err){}
      }
      if(!photos.length) return;
      try{
        const cat = await apiFetch(`/api/cats/${c.id}/actions`, { method:'POST', body:{ action:'add-photo', payload:{ photos } } });
        replaceCatInState(cat); render(); bg.remove();
        toast('已新增照片');
      }catch(e){ toast(e.message,'err'); }
    });
    bg.querySelector('#m_close').addEventListener('click', ()=>bg.remove());
  });
}

// ---------- more ----------
function renderMore(){
  return `
    <div class="more-list">
      <a class="side-link" data-nav="volunteers">${ICONS.users}志工管理</a>
      <a class="side-link" data-nav="cats">${ICONS.cats}貓咪資料庫</a>
      ${state.user.role==='管理員'?`<a class="side-link" data-nav="activity">${ICONS.log}異動紀錄</a>`:''}
      <a class="side-link" id="toPublicLink">${ICONS.home}前台首頁</a>
      <a class="side-link" id="settingsLink">${ICONS.settings}系統設定</a>
      <a class="side-link" id="logoutLink" style="color:#8A4B3F">${ICONS.x}登出</a>
    </div>
    <div style="font-size:11.5px;color:var(--text-soft);text-align:center;margin-top:20px">浪貓不浪中途管理系統 · MVP</div>
  `;
}
function bindMore(){
  document.querySelectorAll('[data-nav]').forEach(a=>a.addEventListener('click', ()=>{
    const v = a.dataset.nav;
    if(v==='activity') openActivityPage(); else if(v==='volunteers') openVolunteersPage(); else go(v);
  }));
  document.getElementById('toPublicLink').addEventListener('click', ()=>go('public-home'));
  document.getElementById('settingsLink').addEventListener('click', ()=>toast('系統設定功能開發中'));
  document.getElementById('logoutLink').addEventListener('click', async ()=>{
    clearSession();
    state.user = null; state.cats = []; state.volunteers = []; state.activityLog = [];
    await loadPublicData();
    state.view = 'public-home';
    render();
  });
}

// ---------- volunteers (admin manages, all can view) ----------
function renderVolunteers(){
  const isAdmin = state.user.role==='管理員';
  return `
    <div class="page-sub">共 ${state.volunteers.length} 位志工帳號${isAdmin?'（管理員帳號另以固定密碼登入，不列於下方）':''}</div>
    <div class="card">
      ${state.volunteers.map(v=>`
        <div class="vol-row">
          <div class="avatar" style="background:var(--secondary);color:var(--text)">${esc(v.name.slice(0,1))}</div>
          <div style="flex:1">
            <div class="log-title">${esc(v.name)} ${v.active===false?`<span class="badge-role badge-off">已停用</span>`:`<span class="badge-role">志工</span>`}</div>
          </div>
          ${isAdmin?`
            <button class="btn btn-ghost btn-sm" data-resetpw="${v.id}">重設密碼</button>
            <button class="btn btn-ghost btn-sm" data-toggle="${v.id}">${v.active===false?'啟用':'停用'}</button>
          `:''}
        </div>
      `).join('') || `<div class="empty" style="padding:24px 10px">尚無志工帳號</div>`}
    </div>
    ${isAdmin?`<button class="btn btn-secondary btn-full" id="addVolBtn" style="margin-top:14px">＋ 新增志工帳號</button>`:''}
  `;
}
function bindVolunteers(){
  const isAdmin = state.user.role==='管理員';
  const addBtn = document.getElementById('addVolBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    openModal(`
      <h3>新增志工帳號</h3>
      <div class="field"><label>姓名</label><input type="text" id="m_name" placeholder="例如：小美"></div>
      <div class="field"><label>密碼</label><input type="password" id="m_pw" placeholder="請設定登入密碼"></div>
      <div class="modal-actions"><button class="btn btn-ghost btn-full" id="m_cancel">取消</button><button class="btn btn-primary btn-full" id="m_save">新增</button></div>
    `, (bg)=>{
      bg.querySelector('#m_cancel').addEventListener('click', ()=>bg.remove());
      bg.querySelector('#m_save').addEventListener('click', async ()=>{
        const saveBtn = bg.querySelector('#m_save');
        const name = bg.querySelector('#m_name').value.trim(); const pw = bg.querySelector('#m_pw').value;
        if(!name){ toast('請輸入姓名','err'); return; }
        if(!pw){ toast('請設定密碼','err'); return; }
        saveBtn.disabled = true; saveBtn.innerHTML = `<span class="spinner"></span> 新增中...`;
        try{
          const vol = await apiFetch('/api/volunteers', { method:'POST', body:{ name, password: pw } });
          state.volunteers.push(vol);
          bg.remove(); render();
          toast('已新增志工帳號');
        }catch(e){
          toast(e.message,'err'); saveBtn.disabled=false; saveBtn.textContent='新增';
        }
      });
    });
  });
  if(isAdmin){
    document.querySelectorAll('[data-resetpw]').forEach(b=>b.addEventListener('click', ()=>{
      const v = state.volunteers.find(x=>x.id===b.dataset.resetpw);
      openModal(`
        <h3>重設 ${esc(v.name)} 的密碼</h3>
        <div class="field"><label>新密碼</label><input type="password" id="m_pw" placeholder="請輸入新密碼"></div>
        <div class="modal-actions"><button class="btn btn-ghost btn-full" id="m_cancel">取消</button><button class="btn btn-primary btn-full" id="m_save">儲存</button></div>
      `, (bg)=>{
        bg.querySelector('#m_cancel').addEventListener('click', ()=>bg.remove());
        bg.querySelector('#m_save').addEventListener('click', async ()=>{
          const saveBtn = bg.querySelector('#m_save');
          const pw = bg.querySelector('#m_pw').value;
          if(!pw){ toast('請輸入新密碼','err'); return; }
          saveBtn.disabled = true; saveBtn.innerHTML = `<span class="spinner"></span> 儲存中...`;
          try{
            await apiFetch(`/api/volunteers/${v.id}`, { method:'PATCH', body:{ action:'reset-password', password: pw } });
            bg.remove(); render(); toast('密碼已更新');
          }catch(e){
            toast(e.message,'err'); saveBtn.disabled=false; saveBtn.textContent='儲存';
          }
        });
      });
    }));
    document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click', async ()=>{
      const v = state.volunteers.find(x=>x.id===b.dataset.toggle);
      try{
        const res = await apiFetch(`/api/volunteers/${v.id}`, { method:'PATCH', body:{ action:'toggle-active' } });
        v.active = res.active;
        render(); toast(v.active?'已啟用帳號':'已停用帳號');
      }catch(e){ toast(e.message,'err'); }
    }));
  }
}

// ---------- activity log (admin only) ----------
function renderActivity(){
  const log = state.activityLog;
  return `
    <div class="page-sub">共 ${log.length} 筆異動紀錄，可看到每一筆操作是由哪位志工／管理員完成</div>
    <div class="card">
      ${log.length? log.map(a=>`
        <div class="log-item" style="position:relative;padding-right:56px">
          <div class="log-date">${fmtDate(a.at)}</div>
          <div class="log-title">${esc(a.action)}${a.catName?`　·　${esc(a.catName)}`:''}</div>
          ${a.detail?`<div class="log-note">${esc(a.detail)}</div>`:''}
          <div class="log-by">操作人員：${esc(a.by)}${a.role?`（${esc(a.role)}）`:''}</div>
          <button class="icon-btn" data-delact="${a.id}" title="刪除這筆紀錄" style="position:absolute;top:14px;right:16px;width:32px;height:32px">${ICONS.x}</button>
        </div>
      `).join('') : `<div class="empty" style="padding:24px 10px">尚無異動紀錄</div>`}
    </div>
  `;
}
function bindActivity(){
  document.querySelectorAll('[data-delact]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('確定要刪除這筆異動紀錄嗎？此動作無法復原。')) return;
    try{
      await apiFetch(`/api/activity/${b.dataset.delact}`, { method:'DELETE' });
      state.activityLog = state.activityLog.filter(a=>a.id!==b.dataset.delact);
      render();
      toast('已刪除');
    }catch(e){ toast(e.message,'err'); }
  }));
}

// ---------------- init ----------------
(async function init(){
  state = freshState();
  const token = localStorage.getItem(TOKEN_KEY);
  const userJson = localStorage.getItem(USER_KEY);
  if(token && userJson){
    try{
      state.user = JSON.parse(userJson);
      await loadInternalData();
      state.view = 'dashboard';
    }catch(e){
      clearSession();
      state.user = null;
      await loadPublicData();
      state.view = 'public-home';
    }
  } else {
    await loadPublicData();
  }
  render();
  const splash = document.getElementById('splash');
  if(splash){ splash.classList.add('hide'); }
})();
</script>
